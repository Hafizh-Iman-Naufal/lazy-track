[work]
hours_per_day = 8
weekly_target = 40
working_days = ["mon", "tue", "wed", "thu", "fri"]
weekend_days = ["sat", "sun"]
timezone = "UTC"  # use Asia/Makassar for WITA
day_start = "10:00"  # first worklog start, local to timezone

[jira]
base_url = ""
assigned_only = true
edit_manual_worklogs = false

[ai]
provider = "gemini"
model = ""

[ai.providers.gemini]
enabled = true

[ai.providers.deepseek]
enabled = true

[ai.providers.minimax]
enabled = true

[ai.providers.openai]
enabled = true

[ai.providers.claude]
enabled = true

[ai.providers.opencode]
enabled = true

[safety]
require_confirmation = true
allow_issue_mutations = false
allow_worklog_create = true
allow_worklog_update = true
allow_worklog_delete = true
worklog_lookback_weeks = 4
max_plan_span_days = 14
max_delete_ops_per_plan = 20
