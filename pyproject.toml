[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lazytrack"
version = "0.1.0-dev"
description = "AI-assisted Jira worklog management CLI"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "LazyTrack Team" }
]
dependencies = [
    "typer>=0.12.0",
    "rich>=13.0.0",
    "pydantic>=2.5.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "python-dateutil>=2.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
]

[project.scripts]
lazytrack = "lazytrack.cli:cli"

[tool.hatch.build.targets.wheel]
packages = ["lazytrack"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
